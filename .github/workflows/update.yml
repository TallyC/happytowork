name: 更新通勤資訊與網頁
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/data.json'
  schedule:
    # UTC：台灣每日 05:07–07:57、14:07–23:57，每十分鐘。
    # 晚間保留給花蓮往返臺北、羅東的班次。
    - cron: '*/10 6-15,21-23 * * *'
    # 台灣 21:13，預先抓隔日班次與預報。
    - cron: '13 13 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: commute-pages
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - if: github.event_name != 'push'
        run: pnpm install --frozen-lockfile
      - if: github.event_name != 'push'
        run: pnpm exec playwright install --with-deps chromium
      - name: 擷取公開頁面
        if: github.event_name != 'push'
        run: node collector.mjs
      - name: 保存最近成功資料
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/data.json
          git diff --cached --quiet || git commit -m 'Update commute data'
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 1
      - uses: actions/deploy-pages@v4
        id: deployment
